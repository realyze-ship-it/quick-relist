name: Synthetic tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - run: npm install --prefix "$RUNNER_TEMP/quick-relist-dom" --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - run: python -m pip install 'pytest>=8,<9' 'selenium>=4.20,<5' 'PySide6-Essentials>=6.7,<7'
      - name: Require Qt tests to be available
        run: python -c "from PySide6 import QtWidgets, QtTest"
      - run: python -m compileall -q quick_relist
      - run: NODE_PATH="$RUNNER_TEMP/quick-relist-dom/node_modules" python -m pytest -q
      - name: Qualify integrated native Chrome workflow
        timeout-minutes: 6
        env:
          QUICK_RELIST_CHROME_TESTS: '1'
        run: |
          driver="${CHROMEWEBDRIVER:?Existing runner ChromeDriver is required}/chromedriver"
          test -x "$driver"
          chrome="$(command -v google-chrome)"
          "$chrome" --version
          "$driver" --version
          export QUICK_RELIST_CHROMEDRIVER="$driver"
          export QUICK_RELIST_CHROME_BINARY="$chrome"
          python -m pytest -q --maxfail=1 tests/test_draft_pipeline_chrome.py tests/test_media_metadata_chrome.py tests/test_editor_recheck_chrome.py tests/test_segmented_dates_chrome.py tests/test_room_positioning_chrome.py tests/test_room_shapes_chrome.py
