[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-relist"
version = "0.1.0.dev0"
description = "A local desktop workspace for carefully preparing listing relists"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
browser = ["selenium>=4.20,<5"]

[project.scripts]
quick-relist = "quick_relist.__main__:main"

[tool.setuptools.packages.find]
include = ["quick_relist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
